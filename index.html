case 7:return tg('Volatile Flask',0,3,t=>{const e=ri(7);const a=dn(2,6),b=dn(1,6);const tot=a;L(`${p.n} throws a Flask: ${t.isP?'2d6='+tot:'PvE auto-hit'}`);if(!t.isP||tot>=C.hit)dmgTo(t,d(20)+2*P,e,p,{skill:1});p.pack.c.splice(p.pack.c.indexOf(it),1);L(`${p.n} throws ${nm(it)}`);after()})}
fin()},
shop(){const p=cur(),k=p.pos,at=!!T[k].shop&&!stormed(T[k].ring);let s=G.shops[k];if(!s||G.round-s.r>=4){s=G.shops[k]={r:G.round,st:[0,1,2].map(()=>mkCons(0,0,true))}}
const o=[];for(let i=0;i<6;i++){const v=p.st[i]+1;if(v>20)continue;const pr=v==10?C.stat10:PR[v];o.push([`+1 ${SN[i]} → ${v} (${Math.round(pr*C.shopM)} SR)`,()=>{const c=Math.round(pr*C.shopM);if(!at)L('Stand on a $ tile to buy.');else if(!(c>=0)||!(p.sr>=c))L('Not enough SR.');else{p.sr-=c;p.st[i]++;sync(p);L(`${p.n} buys ${SN[i]} ${v}`)}A.shop()}])}
s.st.forEach((it,i)=>o.push([`${nm(it)} (${Math.round(CP[it.r]*C.shopM)} SR)`,()=>{const c=Math.round(CP[it.r]*C.shopM);if(!at)L('Stand on a $ tile to buy.');else if(!(c>=0)||!(p.sr>=c))L('Not enough SR.');else if(p.pack.c.length>=C.pc)L('Pack full.');else{p.sr-=c;p.pack.c.push(it);s.st.splice(i,1)}A.shop()}]));
if(C.skAcq!='levelPick')SK.forEach((sk,i)=>{if(!sk[4]||!C.sk[sk[1]]||p.sk.includes(i))return;const pr=Math.round(C.skP[sk[2]-1]*C.shopM),lv=[1,5,9,13,17][sk[2]-1];if(p.lv<lv)return;const pre=sk[2]==1||p.sk.some(j=>SK[j][0]==sk[0]&&SK[j][2]==sk[2]-1);const why=!at?'browse only':p.lv<lv?'needs level '+lv:!pre?'needs a tier '+(sk[2]-1)+' '+sk[0]+' skill':!(pr>=0)||!(p.sr>=pr)?'not enough SR':'';o.push([`SKILL ${sk[0]}: ${sk[1]} T${sk[2]}, ${sk[3]} counters (${pr} SR)${why?' [locked: '+why+']':''}`,()=>{if(why)L('Cannot buy '+sk[1]+': '+why+'.');else{p.sr-=pr;p.sk.push(i);L(`${p.n} buys skill ${sk[1]} (${pr} SR)`)}A.shop()}])});
o.push(['Close',()=>{}]);ask(`Soul Resonance Shop (Soul Corridor) — ${p.sr} SR held${at?'':' — BROWSE ONLY: stand on a $ tile to buy'}`,o)},
legend(){ask('Legend',['▲ Wall (blocks movement and sight)','✕ Obstacle','☠ Boss tile','▣ Chest (colour = tier)','⌂ Spawn / Sanctuary','$ Soul Corridor: Soul Resonance Shop','✚ Shrine','✦ Loot pile','Mob token: ring colour = element, number = CR, ★ = Mini-Boss','Player token: coloured disc with initial, white ring = current turn','Top-left tray: dice just rolled'].map(l=>[l,()=>{}]).concat([['Close',()=>{}]]))}};
// ---------- game UI ----------
function draw(){if(!G)return;const m=$('#modal');
if(G.over){m.hidden=0;m.innerHTML=`<div><h1>${G.over.n} wins!</h1><p>Level ${G.over.lv}, ${G.over.tsr} Total SR.</p><button data-i=0>Back to GM setup</button></div>`;m.onclick=()=>{G=null;m.hidden=1;setup()}}
else if(G.ask){m.hidden=0;m.onclick=mclick;m.innerHTML=`<div><b>${G.ask.t}</b>${G.ask.o.map((o,i)=>`<button data-i=${i}>${o[0]}</button>`).join('')}</div>`}else m.hidden=1;
const p=cur();if(!p)return;const hl={};if(G.tg)for(const k in G.tg.t)hl[k]='t';else{const r=reach(p);for(const k in r)hl[k]='r'}
const t=T[p.pos],bar=e=>`<div class=bar><i style="width:${Math.max(0,100*e.hp/(e.mh||e.mhp))}%"></div>`,dis=(c)=>c?'':'disabled',ok=!G.ask&&!G.over&&!gone(p);
const act=!G.act&&ok,eq=['w','a','s'].map(s=>p.eq[s]?`<div style="color:${RC[p.eq[s].r]}">${nm(p.eq[s])}${p.eq[s].aff.length?' — '+p.eq[s].aff.join(', '):''}</div>`:'').join('');
const learn=p.picks>0&&!G.eng;
$('#bd').innerHTML=board({pl:G.pl,cur:G.ord[G.ti],hl,piles:G.piles,boss:G.boss,storm:G.storm});applyCam();
$('#side').innerHTML=`<h1>Round ${G.round}</h1><div class=row><button data-cam=in title="Zoom in">＋</button><button data-cam=out title="Zoom out">－</button><button data-cam=rs>Reset view</button><button id=svb>Save / Load</button></div><div class=card><b style="color:${p.col}">${p.n}</b> ${p.cls} L${p.lv} (PB+${pbOf(p.lv)}) ${'♥'.repeat(Math.max(0,p.lives))}<br>HP ${p.hp}/${p.mh}${bar(p)}SR ${p.sr} (total ${p.tsr}) · Keys ${p.keys}<br>${SN.map((n,i)=>`${n} ${sv(p,i)}`).join(' ')}<br>DV ${dv(p)} · Range ${rng2(p).join('–')} · Move left ${G.mv}<br>Counters: ${p.cnt.map(e=>`<span style="color:${EC[e]}">●</span>${EL[e]}`).join(' ')||'none'}<br>Status: ${p.sts.map(s=>s.k+s.d).join(', ')||'—'}${shr(p)?' · Shrouded':''}${sanc(p)?' · Sanctuary':''}<br>Affinity ${EL[p.aff]} ${eq}</div>
<div class=row><button title="Roll your Move Die; result is your movement" onclick="A.roll()" ${dis(ok&&!G.rolled)}>Roll move (d${CL[p.cls].d})</button><button title="Attack: PvP = 2d6 (7+ hits); PvE auto-hits; then damage die" onclick="A.atk()" ${dis(act)}>Attack</button><button title="Leave engagement" onclick="A.retreat()" ${dis(act&&G.eng)}>Retreat</button><button title="Open the chest on your tile" onclick="A.chest()" ${dis(act&&t.t=='C')}>Open chest</button><button title="Channel: gain an Advantage Counter" onclick="A.channel()" ${dis(act)}>Channel</button><button title="Rest: recover HP (not while engaged)" onclick="A.rest()" ${dis(act&&!G.eng)}>Rest</button><button title="Use the Shrine on your tile (house rule, not in Guide)" onclick="A.shrine()" ${dis(act&&t.sh&&(p.sh[p.pos]||0)<=G.round)}>Shrine</button><button onclick="A.shop()" ${dis(ok)} title="Soul Resonance Shop: buy skills, +1 stats, consumables. Buying needs a $ tile (Soul Corridor); elsewhere you can browse.">Soul Resonance Shop</button><button onclick="A.legend()" title="What every icon means">? Legend</button><button title="Unlock the Boss (ring 1, needs enough Keys)" onclick="A.unlock()" ${dis(act&&t.ring==1&&p.keys>=C.K&&!G.boss.on)}>Unlock Boss</button><button onclick="A.learn()" ${dis(ok&&learn&&C.skAcq!='shop')} title="Spend a level-up pick on a skill">Learn skill (${p.picks})</button></div>
<div class=card>Skills: ${p.sk.map(i=>`<button onclick="A.skill(${i})" ${dis(act)}>${SK[i][1]}</button>`).join(' ')||'none'}</div>
<div class=card>Pack: ${p.pack.g.map((it,i)=>`<button style="border-color:${RC[it.r]}" onclick="A.equip(${i})" ${dis(ok)} title="Equip">${nm(it)}</button>`).join(' ')} ${p.pack.c.map((it,i)=>`<button style="border-color:${RC[it.r]}" onclick="A.use(${i})" ${dis(ok)}>${nm(it)}</button>`).join(' ')}<br><small>Free consumable: ${p.free?'available':'used'}</small></div>
${G.tg?`<div class=card>Targeting: ${G.tg.title} — click a red tile <button onclick="G.tg=null;draw()">Cancel</button></div>`:''}
<button onclick="A.end()" ${dis(ok&&!G.tg)} style="width:100%;background:var(--ac);color:#111">End turn</button>
<div class=card>${G.pl.map(q=>`<div style="color:${q.col}">${q.n}${q.alive?` ${'♥'.repeat(q.lives)} L${q.lv} HP ${q.hp}/${q.mh} SR ${q.tsr}`:' ☠'}</div>`).join('')}</div><div id=log>${G.log.slice(-40).join('<br>')}</div>`;$('#log').scrollTop=1e5}
function mclick(e){const i=e.target.dataset.i;if(i==null||!G.ask)return;const a=G.ask;G.ask=null;a.o[i][1]();if(!G.ask)flush();draw()}
document.addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!G||G.ask||G.over||!k||e.target.tagName!='polygon')return;
if(G.tg){const t=G.tg.t[k];if(t){const f=G.tg.fn;f(t,k)}return}moveTo(k)});
document.addEventListener('change',e=>{if(G)return;const t=e.target,ds=t.dataset;if(ds.pn!=null)C.names[ds.pn]=t.value;else if(ds.pc!=null)C.cls[ds.pc]=t.value;else if(ds.sk)C.sk[ds.sk]=t.checked;else if(ds.pw!=null){C.pW=C.pW||[];C.pW[ds.pw]=t.value===''?null:+t.value}else if(ds.psr!=null)C.pSR[ds.psr]=t.value===''?null:Math.max(0,+t.value);else if(ds.pst!=null){const[a,b]=ds.pst.split('.');C.pSt[a][b]=t.value===''?null:Math.max(0,Math.min(20,+t.value))}else if(ds.k){const v=t.type=='checkbox'?+t.checked:t.tagName=='SELECT'?t.value:+t.value;if(ds.i!=null)C[ds.k][ds.i]=v;else C[ds.k]=v;if(ds.k=='players')setup();else prev();return}
if(ds.pn!=null||ds.pc!=null||ds.sk||ds.pw!=null||ds.psr!=null||ds.pst!=null)return});
document.addEventListener('click',e=>{if(G)return;const t=e.target,ds=t.dataset;if(ds.t){tab=ds.t;setup()}if(ds.pre){C=Object.assign(newC(),PRE[ds.pre]);setup()}
if(t.id=='rs'){C.seed=(C.seed*7919+13)%100000;setup()}if(t.id=='ex')$('#io').value=JSON.stringify(C);
if(t.id=='im')try{C=Object.assign(newC(),JSON.parse($('#io').value));setup()}catch(x){$('#io').value='Invalid JSON'}if(t.id=='go')start();if(t.id=='simb')simView();if(t.id=='edb')edView();if(t.id=='ted')tedView()});

function applyCam(){const s=$('#sv');if(!s)return;if(!s.dataset.b)s.dataset.b=s.getAttribute('viewBox');const[a,b,w,h]=s.dataset.b.split(' ').map(Number),z=cam.z;s.setAttribute('viewBox',`${a+w/2-w/2/z+cam.x} ${b+h/2-h/2/z+cam.y} ${w/z} ${h/z}`)}
function zoom(f){cam.z=Math.min(40,Math.max(.02,cam.z*f));applyCam()}
let dg=null;
document.addEventListener('pointerdown',e=>{if((G||TED)&&e.target.closest&&e.target.closest('#bd')){dg={x:e.clientX,y:e.clientY};moved=0}});
document.addEventListener('pointermove',e=>{if(!dg)return;const s=$('#sv');if(!s)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;if(!moved&&Math.hypot(dx,dy)<6)return;moved=1;const r=s.getBoundingClientRect(),v=s.viewBox.baseVal,k=Math.max(v.width/r.width,v.height/r.height);cam.x-=dx*k;cam.y-=dy*k;dg.x=e.clientX;dg.y=e.clientY;applyCam()});
document.addEventListener('pointerup',()=>{dg=null});
document.addEventListener('click',e=>{if(moved){moved=0;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('wheel',e=>{if((G||TED)&&e.target.closest&&e.target.closest('#bd')){e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15)}},{passive:false});
// Save/Load: state is plain JSON; RNG position saved so replays stay deterministic
function saveTxt(){if(G.ask||G.tg||G.q.length||G.over)return'Finish the open choice or targeting first, then save again.';return JSON.stringify({v:1,C,T,R,MB,G,rs:rng.g()})}
function loadTxt(t){const o=JSON.parse(t);if(o.v!==1||!o.G)throw 0;C=o.C;T=o.T;R=o.R;MB=o.MB;G=o.G;G.ask=null;G.tg=null;rng=mk(0);rng.s(o.rs);cam={x:0,y:0,z:1};$('#app').innerHTML='<div id=game><div id=bd></div><div id=side></div></div>';draw()}
function ioModal(msg){const m=$('#modal');m.hidden=0;m.innerHTML=`<div><b>Save / Load</b><p><small>${msg||'Copy this text to keep your game. Paste saved text and press Load to restore.'}</small></p><textarea id=sio rows=8 style="width:100%">${saveTxt().replace(/</g,'&lt;')}</textarea><button id=sld>Load from text</button><button id=scl>Close</button></div>`}
document.addEventListener('click',e=>{const t=e.target;if(!G&&!TED)return;if(t.dataset&&t.dataset.cam){t.dataset.cam=='in'?zoom(1.25):t.dataset.cam=='out'?zoom(.8):(cam={x:0,y:0,z:1},applyCam())}
if(t.id=='svb')ioModal();if(t.id=='scl')draw();if(t.id=='sld'){try{loadTxt($('#sio').value)}catch(x){ioModal('Could not read that save text.')}}});
document.addEventListener('click',e=>{if(!TED)return;const k=e.target.dataset&&e.target.dataset.k;if(k)tedClick(k)});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&G&&G.tg){G.tg=null;draw()}});
C=newC();setup();
if(location.search.includes('seed=')){C.seed=+new URLSearchParams(location.search).get('seed');setup()}
</script></body></html>
